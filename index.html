<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1车手性格测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:#15151E;color:#E8E8EE;font-family:system-ui,sans-serif;min-height:100vh;padding:32px 16px;}
.container{max-width:600px;margin:0 auto;}
.text-center{text-align:center;}
.hidden{display:none;}
.title{font-size:clamp(2rem,8vw,3rem);font-weight:bold;color:#E10600;margin-bottom:16px;}
.desc{font-size:1.125rem;opacity:0.8;margin-bottom:32px;line-height:1.6;}
.btn-red{background:#E10600;color:#fff;border:none;border-radius:8px;padding:16px 32px;font-size:1.25rem;font-weight:600;cursor:pointer;transition:0.2s;}
.btn-red:hover{background:#c20500;}
.btn-gray{background:#2A2A38;color:#E8E8EE;border:none;border-radius:8px;padding:12px 20px;font-size:1rem;cursor:pointer;transition:0.2s;}
.btn-gray:hover{opacity:0.8;}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.page-num{color:#E10600;font-weight:bold;font-size:1.1rem;}
.prev-btn{border:1px solid rgba(232,232,238,0.4);background:transparent;color:#E8E8EE;border-radius:8px;padding:6px 12px;font-size:1rem;cursor:pointer;}
.question{font-size:1.25rem;font-weight:600;margin-bottom:24px;line-height:1.5;}
.option{background:#2A2A38;border-radius:8px;padding:16px;margin-bottom:12px;cursor:pointer;transition:0.15s;}
.option:active{transform:scale(0.97);}
.result-name{font-size:clamp(2rem,8vw,3rem);font-weight:bold;color:#E10600;margin-bottom:16px;}
.result-desc{font-size:1.05rem;opacity:0.9;line-height:1.7;margin-bottom:32px;}
.button-group{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
</style>
</head>
<body>
<div class="container">
  <!-- 开始页 -->
  <div id="start-page" class="text-center">
    <h1 class="title">F1车手性格测试</h1>
    <p class="desc">一共15道选择题，全部围绕赛场场景，选择最贴合你的比赛风格，点击选项自动跳转下一题</p>
    <button class="btn-red" onclick="startTest()">开始测试</button>
  </div>

  <!-- 答题页 -->
  <div id="quiz-page" class="hidden">
    <div class="top-row">
      <span class="page-num">第 <span id="current-num">1</span>/15 题</span>
      <button class="prev-btn" id="prev-btn" onclick="prevQuestion()">上一题</button>
    </div>
    <h2 id="question-text" class="question"></h2>
    <div id="option-wrap"></div>
  </div>

  <!-- 结果页 -->
  <div id="result-page" class="hidden text-center">
    <h2 class="title" style="font-size:1.8rem;">你的匹配车手是</h2>
    <div class="result-name" id="result-name"></div>
    <p class="result-desc" id="result-desc"></p>
    <div class="button-group">
      <button class="btn-gray" onclick="copyResult()">复制结果</button>
      <button class="btn-red" onclick="restart()">重新测试</button>
    </div>
  </div>
</div>

<script>
const questions = [
  {q:"正赛发车，你身前有空隙，你会？",o:["稳妥守住线路，优先避免碰撞","果断切入，抢占更好位置","观察对手走线，再决定要不要动手","先观望，不主动冒险","看车队指令再行动"]},
  {q:"被后车持续DRS紧贴追击，你会？",o:["稳定走线，不给超车窗口","频繁变线打乱他节奏","适当让出线路，保护轮胎","心态容易受影响，节奏乱掉","保留轮胎，留到后面反击"]},
  {q:"车队给的策略和你当下的体感冲突，你？",o:["听从车队数据安排","直接和工程师沟通，坚持自己判断","折中，稍微调整一下","容易纠结犹豫，不知道怎么选","先试一圈再反馈感受"]},
  {q:"排位赛最后一圈，轮胎状态一般，你？",o:["保守跑，保证有效圈成绩","全力push，榨干每一点速度","盯着对手成绩再决定力度","紧张放不开，不敢极限跑","慢慢找刹车点，不急冲刺"]},
  {q:"赛车出现轻微异常震动，你第一反应？",o:["冷静判断能不能继续跑","尽力挽救，试着稳住节奏","立刻告知车队反馈情况","心里发慌，担心退赛","跑完这一圈再汇报"]},
  {q:"和同队队友争夺名次，你会？",o:["良性竞争，互相留空间","全力进攻，不因为队友让步","保持距离，互不干扰","不想和队友内卷避让","优先服从车队安排"]},
  {q:"连续多圈轮胎衰减严重，你？",o:["控节奏省胎，熬到进站窗口","硬扛，继续维持圈速","主动要求提前进站","心态急躁，容易失误","慢慢降速，保存赛车"]},
  {q:"赛道上有慢车阻挡，你？",o:["找准干净线路，耐心等机会","抓住机会快速完成超越","减速跟车，不冒险超车","容易被慢车打乱节奏","观察慢车走线再动手"]},
  {q:"比赛最后几圈，燃油紧张，你？",o:["严格按节油节奏跑","优先速度，能拼就拼","一边跑一边和车队确认余量","容易紧张，顾此失彼","小幅控油，不激进"]},
  {q:"拿到分站冠军冲线一刻，你？",o:["平静专注，回归赛后复盘","尽情释放庆祝","第一时间感谢团队","安静享受这一刻","和工程师简单欢呼"]},
  {q:"连续几场比赛成绩不理想，你？",o:["埋头复盘，长期调整","越挫越勇，下场全力冲刺","自我怀疑，情绪低落","换思路尝试新跑法","看淡结果，专注驾驶本身"]},
  {q:"雨天湿地比赛，你更倾向？",o:["稳扎稳打，容错优先","大胆推极限，抓机会超车","谨慎观察别人走线","不敢放速度，保守为主","慢慢适应赛道抓节奏"]},
  {q:"安全车结束重启，你？",o:["精准控速，做好防守准备","积极抢位置，抓住重启机会","保持安全距离，防止追尾","容易紧张出错","跟着前车节奏走"]},
  {q:"【少量场外】赛后采访，你更习惯？",o:["简洁克制，不多说多余内容","风趣轻松，聊得很开放","直白真诚，想到什么说什么","腼腆不爱多说","话术得体周全"]},
  {q:"【少量场外】休赛期，你更愿意？",o:["专注训练，维持竞技状态","放空休息，恢复身心","钻研赛车相关技术内容","和好友相聚放松","短途出行调整状态"]}
];

const drivers = [
  {name:"维斯塔潘",desc:"强大好胜，内心专注冷静，极致追求胜利，情绪稳定，擅长在压力下把控节奏。"},
  {name:"勒克莱尔",desc:"天赋出众，敢拼敢冲，拥有细腻的车感，同时心思敏感，对自己要求极高。"},
  {name:"佩雷兹",desc:"经验老道，擅长防守，情商很高，懂得配合团队，稳健且擅长管理比赛节奏。"},
  {name:"汉密尔顿",desc:"成熟睿智，目标长远，善于表达，意志坚韧，重视团队，拥有强大精神内核。"},
  {name:"拉塞尔",desc:"自律严谨，条理清晰，冷静理性，做事稳重，擅长提前规划每一步。"},
  {name:"诺里斯",desc:"活泼风趣，反应灵动，心态轻松，擅长快速适应变化，赛场内外都很讨喜。"},
  {name:"皮亚斯特里",desc:"内敛踏实，稳步成长，观察力强，低调专注，厚积薄发的类型。"},
  {name:"阿隆索",desc:"斗志长青，老谋深算，经验丰富，坚韧不服输，擅长在逆境寻找机会。"},
  {name:"奥康",desc:"理性克制，注重策略，心思缜密，不容易被外界情绪带动。"},
  {name:"加斯利",desc:"情绪热烈，爆发力强，敢冒险，重情义，状态好的时候上限极高。"},
  {name:"塞恩斯",desc:"松弛从容，热爱生活，技术均衡，懂得平衡竞争和享受赛道。"},
  {name:"里卡多",desc:"外向热情，自带感染力，乐观开朗，擅长调节氛围。"},
  {name:"霍肯伯格",desc:"稳健务实，心态平稳，不冒进，是可靠的赛场老兵。"},
  {name:"阿尔本",desc:"温柔坚韧，抗压能力强，懂得在局限条件下做到最好。"},
  {name:"斯特罗尔",desc:"果决直接，敢拼，有冲劲，专注自己的节奏，不太在意外界声音。"},
  {name:"博塔斯",desc:"沉稳可靠，执行力强，配合度高，情绪平稳不容易波动。"},
  {name:"马格努森",desc:"强硬直接，防守凶悍，风格硬核，比赛态度十分坚决。"},
  {name:"周冠宇",desc:"谦逊沉稳，冷静自律，心思细腻，稳步沉淀，不急不躁。"},
  {name:"萨金特",desc:"年轻勇敢，愿意学习，心态开放，慢慢积累属于自己的节奏。"},
  {name:"德弗里斯",desc:"适应力强，思维灵活，善于快速理解车队给到的信息。"},
];

let current = 0;
let answers = [];

const startPage = document.getElementById("start-page");
const quizPage = document.getElementById("quiz-page");
const resultPage = document.getElementById("result-page");
const qText = document.getElementById("question-text");
const optionWrap = document.getElementById("option-wrap");
const currentNum = document.getElementById("current-num");
const prevBtn = document.getElementById("prev-btn");
const resName = document.getElementById("result-name");
const resDesc = document.getElementById("result-desc");

function startTest(){
  startPage.classList.add("hidden");
  quizPage.classList.remove("hidden");
  loadQuestion();
}
function loadQuestion(){
  const item = questions[current];
  qText.innerText = item.q;
  currentNum.innerText = current+1;
  optionWrap.innerHTML = "";
  item.o.forEach((opt,idx)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = opt;
    div.onclick = ()=>select(idx);
    optionWrap.appendChild(div);
  })
  prevBtn.style.visibility = current === 0 ? "hidden" : "visible";
}
function select(idx){
  answers[current] = idx;
  if(current < questions.length - 1){
    current++;
    loadQuestion();
  }else{
    showResult();
  }
}
function prevQuestion(){
  if(current > 0){
    current--;
    loadQuestion();
  }
}
function showResult(){
  quizPage.classList.add("hidden");
  resultPage.classList.remove("hidden");
  const seed = answers.reduce((a,b)=>a+b,0);
  const pickIdx = seed % drivers.length;
  const driver = drivers[pickIdx];
  resName.innerText = driver.name;
  resDesc.innerText = driver.desc;
}
function copyResult(){
  const txt = `我的F1车手测试结果：${resName.innerText}\n${resDesc.innerText}`;
  navigator.clipboard.writeText(txt).then(()=>alert("已复制！"));
}
function restart(){
  current=0;
  answers=[];
  resultPage.classList.add("hidden");
  startPage.classList.remove("hidden");
}
</script>
</body>
</html>
