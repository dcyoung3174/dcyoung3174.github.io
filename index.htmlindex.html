    sargeant: {name:"洛根·萨金特 Logan Sargeant",tag:"🤍 踏实成长新人",desc:"匹配关键词：踏实努力，稳步积累，慢慢沉淀。正在学习围场生存法则，认真对待每一场练习，一点点积累圈速与比赛经验，持续进步。"},
    tsunoda: {name:"角田裕毅 Yuki Tsunoda",tag:"🧡 热血少年",desc:"匹配关键词：年轻好胜，情绪外放，天赋亮眼。拥有极强的求胜欲，渴望证明自己，敢和顶尖车手缠斗，内心充满斗志，敢冲敢拼。"},
    stroll: {name:"兰斯·斯特罗尔 Lance Stroll",tag:"🤎 从容稳健型",desc:"匹配关键词：从容稳重，专注目标，心理素质稳定。擅长耐心等待机会，赛场发挥稳定，能够顶住压力，依靠策略拿到积分。"},
    alpine: {name:"埃斯特班·阿尔派（阿尔派）",tag:"💜 永不言弃斗士",desc:"匹配关键词：斗志旺盛，敢拼敢冲，战斗属性拉满。永远保持进攻心态，遇到对手敢于对抗，不轻易认输，享受赛道上的激烈缠斗。"}
};

let current = 0;
let scoreBucket = {};
let historyAnswers = [];
function startQuiz(){current=0;scoreBucket={};historyAnswers=[];document.getElementById("page-cover").classList.add("page-hidden");document.getElementById("page-quiz").classList.remove("page-hidden");renderQuestion();}
function renderQuestion(){const q=questions[current];document.getElementById("current-num").innerText=current+1;document.getElementById("question-text").innerText=q.q;const optBox=document.getElementById("options-box");optBox.innerHTML="";q.opts.forEach((opt,idx)=>{const btn=document.createElement("button");btn.className="option-btn";btn.innerText=opt.text;if(historyAnswers[current]&&historyAnswers[current].optIdx===idx){btn.classList.add("selected");}btn.onclick=()=>selectOption(idx,opt.score);optBox.appendChild(btn);})const percent=((current+1)/15)*100;document.getElementById("progress-bar").style.width=percent+"%";document.getElementById("prev-button").style.display=current===0?"none":"block";}
function selectOption(optIdx,scoreKeys){if(historyAnswers[current]){const oldKeys=historyAnswers[current].score;oldKeys.forEach(k=>{scoreBucket[k]--;if(scoreBucket[k]<=0)delete scoreBucket[k];})}historyAnswers[current]={optIdx,score:scoreKeys};scoreKeys.forEach(k=>scoreBucket[k]=(scoreBucket[k]||0)+1);current++;if(current>=questions.length){showResult();return;}renderQuestion();}
function prevQuestion(){current--;renderQuestion();}
function showResult(){document.getElementById("page-quiz").classList.add("page-hidden");document.getElementById("page-result").classList.remove("page-hidden");let maxKey=Object.keys(scoreBucket)[0];for(let k in scoreBucket){if(scoreBucket[k]>scoreBucket[maxKey])maxKey=k;}const res=resultMap[maxKey];document.getElementById("driver-name").innerText=res.name;document.getElementById("driver-tag").innerText=res.tag;document.getElementById("driver-desc").innerText=res.desc;}
function copyResult(){const res=resultMap[Object.keys(scoreBucket).reduce((a,b)=>scoreBucket[a]>scoreBucket[b]?a:b)];const text=`🏁F1车手性格测试\n匹配车手：${res.name}\n${res.tag}\n${res.desc}\n快来测测你是围场里哪位车手！`;navigator.clipboard.writeText(text).then(()=>alert("✅复制成功！"));}
function restartQuiz(){document.getElementById("page-result").classList.add("page-hidden");document.getElementById("page-cover").classList.remove("page-hidden");}
</script>
